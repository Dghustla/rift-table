[build]
  base = "apps/web"
  command = "cd ../.. && npm install --legacy-peer-deps && cd apps/web && npm run build"
  publish = "apps/web/.next"

[build.environment]
  NODE_VERSION = "20"

# Next.js on Netlify uses the @netlify/plugin-nextjs automatically
[[plugins]]
  package = "@netlify/plugin-nextjs"
